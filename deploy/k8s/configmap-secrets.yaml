apiVersion: v1
kind: ConfigMap
metadata:
  name: 7me3-config
  labels:
    app.kubernetes.io/name: 7me3
data:
  APP_ENV: "production"
  PORT: "8080"
  WORKER_HEALTH_PORT: "8081"
  LOG_FORMAT: "json"
  SECRETS_PROVIDER: "file"
  SECRETS_DIR: "/etc/secrets"
  MESSAGE_BUS_BACKEND: "inmemory"
  AUTO_MIGRATE: "true"
  AUDIT_SECRET_KEY: "app-encryption-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: 7me3-secrets
  labels:
    app.kubernetes.io/name: 7me3
type: Opaque
stringData:
  database-url: "postgres://postgres:postgres@postgres-service:5432/orders_db"
  app-encryption-key: "k8s-projected-secret-key-abcdef"
